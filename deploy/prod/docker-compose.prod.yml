# 生产环境（阿里云 Ubuntu）：~/chenaqiweb/backend/deploy
# 数据目录：/home/docker
# 部署前请修改各服务中的 MySQL / Redis 密码
# 与 frontend/deploy 共用 chenaqi-net，谁先启动都可以
# 启动：docker compose -f docker-compose.prod.yml up -d --build
services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4.7
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "ZXCVBNM123"
      MYSQL_DATABASE: test
      TZ: Asia/Shanghai
    volumes:
      - /home/docker/chenaqiweb/mysql:/var/lib/mysql
      - ../core-rpc/desc/sql:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - chenaqi-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/library/redis:7
    container_name: redis
    command: redis-server --requirepass "ZXCVBNM123"
    volumes:
      - /home/docker/chenaqiweb/redis:/data
    ports:
      - "6379:6379"
    networks:
      - chenaqi-net
    restart: unless-stopped

  chroma:
    image: docker.m.daocloud.io/chromadb/chroma:latest
    container_name: chroma
    volumes:
      - /home/docker/chenaqiweb/chroma:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
    networks:
      - chenaqi-net
    restart: unless-stopped

networks:
  chenaqi-net:
    name: chenaqi-net
    driver: bridge
