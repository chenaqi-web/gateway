<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试页面</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }
        .box {
            background: white;
            padding: 50px 80px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-weight: 500;
        }
        p {
            color: #666;
            margin: 0;
            font-size: 16px;
        }
        .tag {
            display: inline-block;
            margin-top: 20px;
            padding: 6px 20px;
            background: #4CAF50;
            color: white;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>Hello, Gin!</h1>
    <p>静态资源访问成功</p>
    <span class="tag">✓ 运行正常</span>
</div>
</body>
</html>
